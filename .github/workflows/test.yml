name: Tests

on:
  pull_request:
    branches: [dev, stg, main]

jobs:
  engine:
    name: Data engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/data-engine/requirements.txt
      # OCR tests need the Tesseract binary; without it they are skipped, not failed.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - run: python -m pytest -q

  apps:
    name: Backend and frontend (node:test, Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w apps/intersbackend
      - run: npm test -w apps/intersfrontend
