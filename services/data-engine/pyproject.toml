[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engine"
version = "0.1.0"
description = "Deterministic-first data engine for UC4 (R&D Data Source Unification): ingestion, renormalization, rules-based triage with evidence, spectral analysis and calibrated ambiguity scoring."
readme = "README.md"
requires-python = ">=3.10"
# Core numerical stack only. Everything else is an optional extra so the
# engine stays importable (and testable) on a bare Python install.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Calibrated model, ROC, exact Hotelling limits (Layer 6).
ml = ["scikit-learn>=1.3", "scipy>=1.10"]
# REST API + uploads + MCP server consumed by the agent / Express backend.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "python-multipart>=0.0.9", "mcp>=1.0"]
# Documents: native PDF text + tables, scanned PDFs / images (OCR), Office, HTML.
docs = ["pdfplumber>=0.10", "pypdf>=4.0", "pypdfium2>=4.0", "pytesseract>=0.3.10", "Pillow>=10.0",
        "python-docx>=1.1", "python-pptx>=0.6.23", "beautifulsoup4>=4.12", "lxml>=5.0", "openpyxl>=3.1"]
# Heavy generic extractors (Tika needs Java).
docs-extra = ["tika>=2.6"]
# Hardware / memory telemetry.
telemetry = ["psutil>=5.9"]
# SQL snapshot and search.
sql = ["duckdb>=0.10"]
# Optional Julia back-ends (requires a Julia install; first call pays JIT start-up).
julia = ["juliacall>=0.9"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "httpx>=0.25", "reportlab>=4.0"]
all = ["data-engine[ml,api,docs,telemetry,sql,plot,dev]"]

[project.scripts]
data-engine-eval = "data_engine.evaluate:main"
data-engine-mcp = "data_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_engine = ["accel/*.cpp", "accel/*.jl", "documents/*.jl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
