  - "Factura 4821: dos computadoras portátiles y un monitor, subtotal, impuesto y total a pagar en 30 días."
  - "Release notes: fixed a crash in the login screen, upgraded the database driver and improved logging."
  - "Notas de versión: se corrigió un error en la pantalla de inicio de sesión y se actualizó el controlador."
  - "The home team won 2-1 after a late goal in the second half; the coach praised the defence."
  - "El equipo local ganó 2 a 1 con un gol en el segundo tiempo; el entrenador elogió la defensa."
  - "Recipe: mix flour, sugar and eggs, bake for 30 minutes at 180 degrees and let it cool."
  - "Receta: mezcle harina, azúcar y huevos, hornee 30 minutos a 180 grados y deje enfriar."
  - "Apartment for rent: two bedrooms, one bathroom, parking space, close to the city centre."
  - "Travel itinerary: flight on Monday, hotel check-in at 3 pm, museum tour on Tuesday morning."
  - "Itinerario de viaje: vuelo el lunes, registro en el hotel a las 3 pm y visita al museo el martes."
  - "Employee handbook: vacation policy, remote work rules and expense reimbursement procedure."
  - "Quarterly financial report: revenue grew 4 percent, operating margin and earnings per share."
  - "Informe financiero trimestral: los ingresos crecieron 4 por ciento, margen operativo y utilidad por acción."
  - "Lecture notes: Maxwell equations, gauge invariance and the wave equation in vacuum."
  - "Car manual: check tyre pressure monthly, replace the oil filter every 10,000 km."
