  - "Coffee futures rose as drought hit the harvest; traders expect lower exports this season."
  - "Los precios del maíz subieron en la bolsa por la sequía; los exportadores esperan menos ventas."
  - "Garden blog: water your tomato plants in the morning and add compost every two weeks."
  - "Receta de ensalada: tomate, pepino, lechuga y cebolla con aceite de oliva y limón."
  - "Tractor dealer invoice: one used tractor, delivery to the farm and two years of maintenance."
  - "Supermarket weekly offers: melons, watermelons and peppers at half price until Sunday."
